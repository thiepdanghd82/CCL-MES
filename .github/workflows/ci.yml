name: CI

# `dotnet test` gate on every push to main + every PR. Two jobs run in
# parallel: `test` (legacy CCL.MES.sln — T1 unit + T2 integration) and
# `hybrid-test` (the CCL-MES-Hybrid Api + Razor + Client suites).
# No deploy, no secret, no live-DB touch — the suites use isolated /tmp
# SQLite per [Fact] (see tests/CCL.MES.Tests/Integration/_Support/
# IsolatedDbFixture.cs). Mirrors the dev box (.NET SDK 10.0.300, ubuntu).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Allow only one concurrent CI run per ref so a fast-follow push cancels
# the in-progress build (saves runner minutes; the latest commit is what
# matters).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  gates:
    name: Gate scripts (luật kiến trúc + hệ thiết kế)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Pha 4 AUDIT của vòng lặp (CCL-MES-Hybrid/docs/AGENT-LOOP.md): kiểm TĨNH
    # mọi luật mà dự án đã trả tiền để học (L34/L35/L37/L39 + L40..L43 mới).
    # Chạy độc lập với `test`/`hybrid-test`: không cần .NET SDK, không cần DB,
    # chỉ bash + python3 → xong trong vài giây và cho tín hiệu sớm nhất trong PR.
    # Gate xanh KHÔNG có nghĩa tính năng chạy — đó là pha 5 VERIFY, việc khác.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Self-test trước: chứng minh từng detector còn BẮT ĐƯỢC vi phạm.
      # Một gate hỏng thầm lặng (luôn PASS) còn tệ hơn không có gate.
      - name: Gate self-test (detector còn sống?)
        run: bash CCL-MES-Hybrid/scripts/gate-all.sh --self-test

      - name: Gate run (cây hiện tại có vi phạm không?)
        run: bash CCL-MES-Hybrid/scripts/gate-all.sh
  test:
    name: Build + xUnit (T1 unit + T2a/T2b integration)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0.300
        uses: actions/setup-dotnet@v4
        with:
          # Pin matches dev box (`dotnet --version` → 10.0.300). Any drift
          # here would silently change EF Core / runtime behavior.
          dotnet-version: '10.0.300'

      # Restore + build separately so a restore failure (NuGet) is easy to
      # distinguish from a compile failure in the workflow log.
      - name: Restore
        run: dotnet restore CCL.MES.sln

      - name: Build (Release, no-restore)
        run: dotnet build CCL.MES.sln --configuration Release --no-restore

      - name: Test (Release, no-build)
        # --logger trx for the test-summary action below; --blame to capture
        # a hang dump if a [Fact] never returns (SQLite + /tmp shouldn't,
        # but cheap insurance).
        run: |
          dotnet test tests/CCL.MES.Tests/CCL.MES.Tests.csproj \
            --configuration Release \
            --no-build \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory TestResults \
            --blame \
            --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  hybrid-test:
    name: Build + xUnit (Hybrid — Api + Razor + Client)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # The Hybrid stack lives in its own solution (CCL-MES-Hybrid.sln) which
    # also contains the MAUI app `CCL.MES.Hybrid` (net10.0-maccatalyst /
    # -windows) — that project CANNOT build on ubuntu (no Catalyst/Windows
    # workload). So we DO NOT build the whole .sln; we drive `dotnet test`
    # at each of the 3 net10.0 test projects directly. Their ProjectReference
    # graphs pull in Api/Shared/Hybrid.Razor/Hybrid.Client + the read-only
    # legacy Domain/Application/Infrastructure — but never the MAUI project.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK 10.0.300
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.300'

      # `dotnet test` restores + builds each project. We keep them as separate
      # steps so a failure log points at the exact suite (Api vs Razor vs
      # Client). --blame captures a hang dump if a [Fact] never returns.
      - name: Test — Hybrid Api (.Api.Tests)
        run: |
          dotnet test CCL-MES-Hybrid/tests/CCL.MES.Api.Tests/CCL.MES.Api.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=hybrid-api.trx" \
            --results-directory TestResults \
            --blame \
            --verbosity normal

      - name: Test — Hybrid Razor (bUnit)
        run: |
          dotnet test CCL-MES-Hybrid/tests/CCL.MES.Hybrid.Razor.Tests/CCL.MES.Hybrid.Razor.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=hybrid-razor.trx" \
            --results-directory TestResults \
            --blame \
            --verbosity normal

      - name: Test — Hybrid Client (auth/JWT)
        run: |
          dotnet test CCL-MES-Hybrid/tests/CCL.MES.Hybrid.Client.Tests/CCL.MES.Hybrid.Client.Tests.csproj \
            --configuration Release \
            --logger "trx;LogFileName=hybrid-client.trx" \
            --results-directory TestResults \
            --blame \
            --verbosity normal

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hybrid-test-results
          path: TestResults/
          retention-days: 7
